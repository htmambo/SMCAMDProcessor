name: CD

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # 依赖准备(MacKernelSDK 子模块 / Lilu.kext / VirtualSMC)与打包均由脚本内建
      - name: Build and Package
        run: ./Scripts/build.sh --clean

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/Release.zip

      - name: Attach Package to Release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/Release.zip --clobber
